version: "3.8"

services:
  traefik:
    image: traefik:v2.10
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "5050:8080"
      - "1883:1883"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    configs:
      - source: traefik_config
        target: /etc/traefik/traefik.yml
    networks:
      - app-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`traefik.localhost`)"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.middlewares=auth"
      - "traefik.http.middlewares.auth.basicauth.users=admin:mypassword"
    deploy:
      placement:
        constraints:
          - "node.hostname == u24serv-cac"

  mqtt-broker:
    image: emqx/emqx:5.3.0
    configs:
      - source: emqx_config
        target: /opt/emqx/etc/emqx.conf
    volumes:
      - emqx_data:/opt/emqx/data
      - emqx_log:/opt/emqx/log
    restart: unless-stopped
    networks:
      - app-network
    labels:
      - "traefik.enable=true"
      - "traefik.tcp.routers.mqtt-router.entrypoints=mqtt"
      - "traefik.tcp.routers.mqtt-router.rule=HostSNI(`*`)"
      - "traefik.tcp.routers.mqtt-router.service=mqtt-service"
      - "traefik.tcp.services.mqtt-service.loadbalancer.server.port=1883"
    healthcheck:
      test: ["CMD", "emqx_ctl", "status"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      placement:
        constraints:
          - "node.hostname == u24serv-cac"

  telemetry-storage-service-redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - telemetry-storage-service-redis_data:/data
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      placement:
        constraints:
          - "node.hostname == u24serv-db"

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    ports:
      - "5672:5672"

    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      placement:
        constraints:
          - "node.hostname == u24serv-db"

  prometheus:
    image: prom/prometheus:latest
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
    volumes:
      - prometheus_data:/prometheus
    networks:
      - app-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    deploy:
      placement:
        constraints:
          - "node.hostname == u24serv-db"

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SERVER_HTTP_PORT: 2030
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_SERVER_ROOT_URL: https://media115.lanestel.fr/grafana
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_AUTH_PROXY_ENABLED: "true"
      GF_AUTH_PROXY_HEADER_NAME: "X-WEBAUTH-USER"
      GF_AUTH_PROXY_HEADER_PROPERTY: "username"
      GF_AUTH_PROXY_AUTO_SIGN_UP: "true"
      GF_AUTH_PROXY_HEADERS: "Role:X-WEBAUTH-ROLE"
    volumes:
      - grafana_data:/var/lib/grafana
    configs:
      - source: grafana_config
        target: /etc/grafana/grafana.ini
      - source: grafana_datasource_config
        target: /etc/grafana/provisioning/datasources/influxdb.yml
      - source: grafana_dashboard_config
        target: /etc/grafana/provisioning/dashboards/dashboard.yml
      - source: grafana_iot_sensors_dashboard
        target: /etc/grafana/provisioning/dashboards/iot-sensors.json
      - source: grafana_iot_overview_dashboard
        target: /etc/grafana/provisioning/dashboards/iot-overview.json
    networks:
      - app-network
    depends_on:
      - prometheus
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`media115.lanestel.fr`) && PathPrefix(`/grafana`)"
      - "traefik.http.routers.grafana.entrypoints=http"
      - "traefik.http.routers.grafana.priority=10"
      - "traefik.http.routers.grafana.service=grafana-svc"
      - "traefik.http.routers.grafana.middlewares=auth-forward"
      - "traefik.http.services.grafana-svc.loadbalancer.server.port=2030"
#      - "traefik.http.middlewares.strip-grafana-prefix.stripprefix.prefixes=/grafana"
      - "traefik.http.middlewares.auth-forward.forwardauth.address=http://sss-web-admin:2010/api/auth/traefik-forward"
      - "traefik.http.middlewares.auth-forward.forwardauth.authRequestHeaders=Cookie,X-Forwarded-For,X-Forwarded-Proto,X-Forwarded-Uri"
      - "traefik.http.middlewares.auth-forward.forwardauth.authResponseHeaders=X-WEBAUTH-USER,X-WEBAUTH-ROLE"
    deploy:
      placement:
        constraints:
          - "node.hostname == u24serv-cac"

  influxdb:
    image: influxdb:2.7-alpine
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: password
      DOCKER_INFLUXDB_INIT_ORG: sss-quangdung
      DOCKER_INFLUXDB_INIT_BUCKET: telemetry-data
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: my-super-secret-token
    volumes:
      - influxdb_data:/var/lib/influxdb2
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      placement:
        constraints:
          - "node.hostname == u24serv-db"

  auth-acl-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: auth_acl_db
      POSTGRES_USER: quarkus
      POSTGRES_PASSWORD: quarkus123
    volumes:
      - postgres_data_auth_acl_service:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - auth-acl-private-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      placement:
        constraints:
          - "node.hostname == u24serv-db"

  sss-auth-acl-service:
    image: 192.168.152.117:5000/quangdung/sss-auth-and-acl-service:latest
    environment:
      SERVICE_PORT: 2001
      DB_ADDRESS: auth-acl-db:5432
      DB_USERNAME: quarkus
      DB_PASSWORD: quarkus123
      DEVICE_SERVICE_API_URL: http://sss-device-service:2002/
      MQTT_BROKER_URL: mqtt://mqtt-broker:1883
      MQTT_ADMIN_USERNAME: admin
      MQTT_ADMIN_PASSWORD: admin123
      MQTT_ADMIN_CLIENTID: ADMINCLIENT
      BCRYPT_SALT_ROUNDS: 12
      BCRYPT_CUSTOM_SALT: $2a$12$abcdefghijklmnopqrstuv
      APP_SECRET_KEY: your-secret-key-here-change-in-production
    restart: unless-stopped
    networks:
      - app-network
      - auth-acl-private-network
    depends_on:
      - mqtt-broker
      - redis
      - auth-acl-db
      - sss-device-service
    deploy:
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      placement:
        constraints:
          - "node.hostname == u24serv-cac"

  device-service-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: device_db
      POSTGRES_USER: quarkus
      POSTGRES_PASSWORD: quarkus123
    volumes:
      - device-service-db-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - device-service-private-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      placement:
        constraints:
          - "node.hostname == u24serv-db"

  sss-device-service:
    image: 192.168.152.117:5000/quangdung/sss-device-service:latest
    ports:
      - "2002:2002"

    environment:
      DB_ADDRESS: device-service-db:5432
      DB_USERNAME: quarkus
      DB_PASSWORD: quarkus123
      DB_GENERATION: update
      MQTT_AUTH_ACL_URL: http://sss-auth-acl-service:2001
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
    restart: unless-stopped
    networks:
      - app-network
      - device-service-private-network
    depends_on:
      - rabbitmq
      - device-service-db
    deploy:
      placement:
        constraints:
          - "node.hostname == u24serv-cac"

  sss-data-ingestor-serivce:
    image: 192.168.152.117:5000/quangdung/sss-data-ingestor-service:latest
    environment:
      MQTT_HOST: mqtt-broker
      MQTT_PORT: 1883
      MQTT_USER: admin
      MQTT_PASSWORD: admin123
      MQTT_CLIENT_ID: ADMINCLIENT
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
    restart: unless-stopped
    depends_on:
      - rabbitmq
      - mqtt-broker
      - sss-auth-acl-service
    networks:
      - app-network
    deploy:
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      placement:
        constraints:
          - "node.hostname == u24serv-cac"

  sss-telemetry-storage-service:
    image: 192.168.152.117:5000/quangdung/sss-telemetry-storage-service:latest
    networks:
      - app-network
    depends_on:
      - rabbitmq
      - influxdb
      - sss-data-ingestor-serivce
    restart: unless-stopped
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      REDIS_URL: redis://telemetry-storage-service-redis:6379
      DEVICE_INFO_API_URL: http://sss-auth-acl-service:2001/
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: my-super-secret-token
      INFLUXDB_ORG: sss-quangdung
      INFLUXDB_BUCKET: telemetry-data
    deploy:
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      placement:
        constraints:
          - "node.hostname == u24serv-cac"

  sss-web-admin:
    image: 192.168.152.117:5000/quangdung/sss-web-admin:latest
    environment:
      NODE_ENV: production
      NEXTAUTH_URL: https://media115.lanestel.fr
      NEXTAUTH_SECRET: your-nextauth-secret-change-in-production-min-32-chars
      ADMIN_USER: admin
      ADMIN_PASSWORD: admin123
      DEVICE_SERVICE_API_URL: http://sss-device-service:2002
      AUTH_ACL_SERVICE_API_URL: http://sss-auth-acl-service:2001
#      GRAFANA_URL: http://grafana:2030
#      GRAFANA_PUBLIC_URL: http://media115.lanestel.fr/grafana
      PORT: 2010
      HOSTNAME: "0.0.0.0"
    restart: unless-stopped
    networks:
      - app-network
    depends_on:
      - grafana
      - sss-device-service
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web-admin.rule=Host(`media115.lanestel.fr`) && !PathPrefix(`/grafana`)"
      - "traefik.http.routers.web-admin.entrypoints=http"
      - "traefik.http.routers.web-admin.priority=1"
      - "traefik.http.services.web-admin-svc.loadbalancer.server.port=2010"
#      - "traefik.http.routers.web-admin.middlewares=headers-admin"
#     - "traefik.http.middlewares.headers-admin.headers.customrequestheaders.X-Forwarded-Proto=http"
#      - "traefik.http.middlewares.headers-admin.headers.customrequestheaders.X-Forwarded-Host=media115.lanestel.fr"
    deploy:
      placement:
        constraints:
          - "node.hostname == u24serv-cac"

volumes:
  emqx_data:
  emqx_log:
  grafana_data:
  telemetry-storage-service-redis_data:
  rabbitmq_data:
  influxdb_data:
  postgres_data_auth_acl_service:
  device-service-db-data:
  prometheus_data:

networks:
  app-network:
    driver: overlay
    attachable: true
  auth-acl-private-network:
    driver: overlay
    attachable: true
  device-service-private-network:
    driver: overlay
    attachable: true

configs:
  traefik_config:
    external: true
  prometheus_config:
    external: true
  emqx_config:
    external: true
  grafana_config:
    external: true
  grafana_datasource_config:
    external: true
  grafana_dashboard_config:
    external: true
  grafana_iot_sensors_dashboard:
    external: true
  grafana_iot_overview_dashboard:
    external: true