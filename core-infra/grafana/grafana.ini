[paths]
provisioning = /etc/grafana/provisioning

[server]
protocol = http
http_port = 2030
domain = media115.lanestel.fr
root_url = https://media115.lanestel.fr/grafana/
serve_from_sub_path = true

[security]
admin_user = admin
admin_password = admin

[auth.proxy]
enabled = true
header_name = X-WEBAUTH-USER
header_property = username
auto_sign_up = true
whitelist = 172.16.0.0/12,10.0.0.0/8,192.168.0.0/16
headers = Name:X-WEBAUTH-NAME Role:X-WEBAUTH-ROLE

[users]
allow_sign_up = false
auto_assign_org = true
auto_assign_org_id = 1
auto_assign_org_role = Admin

[auth]
disable_login_form = true

[log]
mode = console
level = info